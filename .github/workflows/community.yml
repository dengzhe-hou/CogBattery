name: Community submissions

# Pull requests that add or change files in submissions/ are replayed and scored, with the key measures
# in the check summary. After a merge to main the same scoring rewrites docs/data/community.json and
# rebuilds the project page. No model is called.

on:
  pull_request:
    paths: ["submissions/**"]
  push:
    branches: [main]
    paths: ["submissions/**"]
  workflow_dispatch:

concurrency:
  group: community-${{ github.ref }}

jobs:
  score:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CogBattery
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[paper]"

      - name: Download the sources
        run: python -m scripts.release.fetch_sources

      - name: Build the paper materials
        run: python -m scripts.release.build_paper_materials

      - name: Replay and score the submissions
        run: |
          python -m scripts.release.community --materials results/paper_materials/manifest.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Publish the community table
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet docs/data/community.json; then
            echo "The community table is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/community.json
          git commit -m "Update the community leaderboard"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
